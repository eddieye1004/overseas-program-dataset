name: Validate Dataset

on:
  push:
    branches: [main, master]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/validate.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main, master]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
  schedule:
    # 每周一 UTC 01:00 自动运行（北京时间 09:00）
    # 用于发现官方链接失效、数据过期等问题
    - cron: '0 1 * * 1'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read

jobs:
  validate:
    name: 数据校验
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 配置 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'

      - name: 运行单元测试
        # 先验证校验器自身行为正确，再拿它的结论去判定数据 ——
        # 否则一旦校验器坏了，它的「通过」毫无意义。
        run: python -m unittest discover -s tests -v

      - name: 校验数据完整性（离线）
        # 定时任务（cron）加 --strict：validate.py 的 --strict 是「有告警即退出码 1」，
        # 于是「数据距今超过 STALE_DAYS」这类告警会真正把构建打红，逼出需要重新核实的项目。
        # push / pull_request 不加：数据变旧属于维护节奏问题，不该挡住一次与数据无关的文档修改。
        env:
          STRICT_ON_SCHEDULE: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$STRICT_ON_SCHEDULE" = "true" ]; then
            python scripts/validate.py --strict
          else
            python scripts/validate.py
          fi

      - name: 来源清单必须与数据一致
        # data/sources.md 是 scripts/gen_sources.py 的产物。手工维护时期它漂到了
        # 只列 28 条 URL（记录里 38 条），德国 §16e 法条页与日本査証手数料页
        # 这两个唯一 A 级依据在清单里根本不存在。这条闸门让漂移不可能通过 CI。
        run: python scripts/gen_sources.py --check

      - name: 检查官方链接存活
        # 链接检查涉及网络请求，可能因目标站点反爬或临时故障产生误报，
        # 因此设置为 continue-on-error，不阻断 CI，但会在日志中报告。
        continue-on-error: true
        run: python scripts/validate.py --check-links --timeout 20

      - name: 生成 JSON 报告（供归档）
        if: always()
        run: python scripts/validate.py --json > validate-report.json || true

      - name: 上传校验报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: validate-report
          path: validate-report.json
          retention-days: 30

      - name: 检查是否有数据文件遗失来源标注
        run: |
          python - <<'PY'
          import json, glob, sys
          missing = []
          for path in sorted(glob.glob('data/programs/*.json')):
              with open(path, encoding='utf-8') as fh:
                  doc = json.load(fh)
              srcs = doc.get('sources', [])
              if not any(s.get('type') == 'primary' for s in srcs if isinstance(s, dict)):
                  missing.append(path)
          if missing:
              print('以下文件缺少 primary 官方来源：')
              for m in missing:
                  print('  -', m)
              sys.exit(1)
          print('全部 %d 个项目均有 primary 官方来源' % len(glob.glob('data/programs/*.json')))
          PY
