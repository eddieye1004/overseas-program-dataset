name: Validate Dataset

on:
  push:
    branches: [main, master]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/validate.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main, master]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
  schedule:
    # 每周一 UTC 01:00 自动运行（北京时间 09:00）
    # 用于发现官方链接失效、数据过期等问题
    - cron: '0 1 * * 1'
  workflow_dispatch:  # 允许手动触发

permissions:
  # 最小权限：读代码 + 只写 issue。
  # issues: write 是为了「复核到期就开一张 issue 喊人」（见最后一步 sync_issue.py）。
  # 不给 pull-requests / packages / contents: write —— 这个工作流只读数据、只写 issue。
  contents: read
  issues: write

jobs:
  validate:
    name: 数据校验
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: 运行单元测试
        # 先验证校验器自身行为正确，再拿它的结论去判定数据 ——
        # 否则一旦校验器坏了，它的「通过」毫无意义。
        run: python -m unittest discover -s tests -v

      - name: 校验数据完整性（离线）
        # 定时任务（cron）加 --strict：validate.py 的 --strict 是「有告警即退出码 1」，
        # 于是「数据距今超过 STALE_DAYS」这类告警会真正把构建打红，逼出需要重新核实的项目。
        # push / pull_request 不加：数据变旧属于维护节奏问题，不该挡住一次与数据无关的文档修改。
        env:
          STRICT_ON_SCHEDULE: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$STRICT_ON_SCHEDULE" = "true" ]; then
            python scripts/validate.py --strict
          else
            python scripts/validate.py
          fi

      - name: 来源清单必须与数据一致
        # data/sources.md 是 scripts/gen_sources.py 的产物。手工维护时期它漂到了
        # 只列 28 条 URL（记录里 38 条），德国 §16e 法条页与日本査証手数料页
        # 这两个唯一 A 级依据在清单里根本不存在。这条闸门让漂移不可能通过 CI。
        run: python scripts/gen_sources.py --check

      - name: 检查官方链接存活
        # 链接检查涉及网络请求，可能因目标站点反爬或临时故障产生误报，
        # 因此设置为 continue-on-error，不阻断 CI，但会在日志中报告。
        continue-on-error: true
        run: python scripts/validate.py --check-links --timeout 20

      - name: 复核到期必须被看见
        # 「数据会过时」原本只是一句免责声明：validate.py 会在 180 天后告警，
        # 但告警不落盘、不进仓库、不产生待办，CI 红一次也就过去了，
        # 谁也不知道该去核哪几条。这里把复核周期变成一道真的闸门：
        # 定时任务（schema 里的 cron）跑 --check，有记录越过周期就退出码 1；
        # push / PR 不阻断 —— 一次文档修改不该因为数据该复核了而失败。
        #
        # 顺带把台账写进 artifact：人不再需要自己算「哪条最久没核」。
        env:
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
        run: |
          python scripts/track.py
          if [ "$IS_SCHEDULE" = "true" ]; then
            python scripts/track.py --check
          fi

      - name: 复核清单开 issue（幂等）
        # 上面那一步让构建变红，但红由谁看见？GitHub 的失败通知默认只发给
        # 最后一个推送者，而定时任务是没有人推的 —— 于是它每周红一次、红到被无视。
        # 这里把同一份台账写进一张 issue：仓库里唯一「有人真的会看到」的位置。
        #
        # 幂等靠三件固定不变的东西：固定标题、固定标签、正文里的固定 marker。
        # 每次先按标题搜 open issue，有就原地更新、没有才新建，因此连跑 N 周
        # 也只有一张。反过来，标题里一旦拼日期或运行号，就会变成每周刷一张新 issue，
        # 比不做还吵 —— tests/test_sync_issue.py 专门钉住了这一点。
        #
        # 这一层是**叠加**在「让构建红」之上，不是替代：红是给 CI 的硬信号，
        # issue 是给人的待办。所以这一步用 if: always()，即便上面已经红了，
        # issue 也必须照常更新，否则最该喊人的时候恰好喊不出来。
        #
        # 只在定时任务上跑：push/PR 时数据该复核与否不是本次改动的责任，
        # 往 PR 里塞 issue 更新会吵到评审。
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_issue.py

      - name: 生成 JSON 报告（供归档）
        if: always()
        run: python scripts/validate.py --json > validate-report.json || true

      - name: 上传校验报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: validate-report
          path: |
            validate-report.json
            data/tracking.json
            data/FRESHNESS.md
          retention-days: 30

      - name: 检查是否有数据文件遗失来源标注
        run: |
          python - <<'PY'
          import json, glob, sys
          missing = []
          for path in sorted(glob.glob('data/programs/*.json')):
              with open(path, encoding='utf-8') as fh:
                  doc = json.load(fh)
              srcs = doc.get('sources', [])
              if not any(s.get('type') == 'primary' for s in srcs if isinstance(s, dict)):
                  missing.append(path)
          if missing:
              print('以下文件缺少 primary 官方来源：')
              for m in missing:
                  print('  -', m)
              sys.exit(1)
          print('全部 %d 个项目均有 primary 官方来源' % len(glob.glob('data/programs/*.json')))
          PY
